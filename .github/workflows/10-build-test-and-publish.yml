name: Build Book API and Publish Docker Image


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# This workflow can start in two ways:
#
# 1. Developer pushes code to main
#
# 2. Automation repository sends:
#
#       automation-tests-passed
#
# ============================================================

on:

  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - automation-tests-passed


# ============================================================
# PERMISSIONS
# ============================================================
#
# id-token: write
#
# Required for GitHub OIDC authentication with AWS.
#
# contents: read
#
# Required to checkout the repository.
#
# ============================================================

permissions:
  id-token: write
  contents: read


jobs:


  # ==========================================================
  # JOB 1 - BUILD BOOK API
  # ==========================================================
  #
  # Runs when:
  #
  # Developer pushes code
  #
  # OR
  #
  # Workflow is manually started.
  #
  # It does NOT run when automation sends
  # automation-tests-passed.
  #
  # ==========================================================

  build:

    name: Build Book API

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest


    steps:


      # -------------------------------------------------------
      # STEP 1 - CHECKOUT APPLICATION
      # -------------------------------------------------------

      - name: Checkout Book API
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # STEP 2 - INSTALL JAVA
      # -------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -------------------------------------------------------
      # STEP 3 - BUILD APPLICATION
      # -------------------------------------------------------
      #
      # Compile application and run unit tests.
      #
      # If this fails, the next step will NOT execute.
      #
      # -------------------------------------------------------

      - name: Build and Unit Test Book API

        run: |

          echo "=========================================="
          echo "BUILDING BOOK API"
          echo "=========================================="

          mvn --batch-mode clean verify


      # -------------------------------------------------------
      # STEP 4 - TRIGGER AUTOMATION REPOSITORY
      # -------------------------------------------------------
      #
      # This sends:
      #
      #     book-api-build-success
      #
      # to:
      #
      #     test-bookapi-automation
      #
      # -------------------------------------------------------

      - name: Trigger Automation Repository

        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_REPO_TOKEN }}

        run: |

          echo "=========================================="
          echo "APPLICATION BUILD PASSED"
          echo "=========================================="

          echo ""
          echo "Triggering automation tests..."
          echo ""

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AnilkumarDave/testbook-api-automation-practice/dispatches \
            -d '{"event_type":"book-api-build-success"}'

          echo ""
          echo "Automation workflow triggered successfully."


  # ==========================================================
  # JOB 2 - BUILD DOCKER IMAGE AND PUSH TO ECR
  # ==========================================================
  #
  # IMPORTANT:
  #
  # This job runs ONLY when the automation repository sends:
  #
  #     automation-tests-passed
  #
  # Therefore:
  #
  # Automation FAILS
  #       ↓
  # No automation-tests-passed
  #       ↓
  # This job NEVER runs
  #
  #
  # Automation PASSES
  #       ↓
  # automation-tests-passed
  #       ↓
  # This job runs
  #       ↓
  # Docker build
  #       ↓
  # Push to ECR
  #
  # ==========================================================

  docker-build-and-push:

    name: Build Docker Image and Push to ECR

    if: >
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'automation-tests-passed'

    runs-on: ubuntu-latest


    steps:


      # -------------------------------------------------------
      # STEP 1 - CHECKOUT APPLICATION
      # -------------------------------------------------------
      #
      # We checkout the current application repository.
      #
      # -------------------------------------------------------

      - name: Checkout Application
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # STEP 2 - CONFIGURE AWS CREDENTIALS
      # -------------------------------------------------------
      #
      # GitHub uses OIDC to assume the AWS IAM role.
      #
      # AWS_ROLE_ARN must exist in:
      #
      # Application Repo
      #   → Settings
      #   → Secrets and variables
      #   → Actions
      #
      # -------------------------------------------------------
      - name: Inspect GitHub OIDC subject
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud}' || true
        
      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1


      # -------------------------------------------------------
      # STEP 3 - LOGIN TO AMAZON ECR
      # -------------------------------------------------------

      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # -------------------------------------------------------
      # STEP 4 - BUILD DOCKER IMAGE
      # -------------------------------------------------------
      #
      # FIX:
      #
      # Previously we used:
      #
      # github.event.client_payload.application_sha
      #
      # But the automation repository was not sending it.
      #
      # Therefore IMAGE_TAG became empty:
      #
      #     mybookapi:
      #
      # which caused:
      #
      #     invalid reference format
      #
      #
      # Now we simply obtain the SHA from the checked-out
      # application repository:
      #
      #     git rev-parse --short HEAD
      #
      # Example:
      #
      #     6b81a4f
      #
      # Docker image becomes:
      #
      #     mybookapi:6b81a4f
      #
      # -------------------------------------------------------

      - name: Build Docker Image

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mybookapi

        run: |

          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "=========================================="
          echo "BUILDING PRODUCTION DOCKER IMAGE"
          echo "=========================================="

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Docker image tag:"
          echo "$IMAGE_TAG"

          echo ""
          echo "Docker image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo ""

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .


      # -------------------------------------------------------
      # STEP 5 - PUSH DOCKER IMAGE TO ECR
      # -------------------------------------------------------

      - name: Push Docker Image to ECR

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mybookapi

        run: |

          IMAGE_TAG=$(git rev-parse --short HEAD)

          echo "=========================================="
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "=========================================="

          echo ""
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo ""

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "DOCKER IMAGE SUCCESSFULLY PUSHED TO ECR"
          echo "=========================================="

          echo ""
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
