name: Build Test and Publish Book API

# ============================================================
# TWO EVENTS CAN START THIS WORKFLOW
# ============================================================
#
# 1. PUSH
#    Developer changes application code.
#
# 2. REPOSITORY_DISPATCH
#    Automation repository tells us:
#    "Automation tests passed."
#
# ============================================================

on:

  push:
    branches:
      - main

  workflow_dispatch:

  repository_dispatch:
    types:
      - automation-tests-passed


permissions:
  contents: read
  id-token: write


jobs:

  # ==========================================================
  # JOB 1 - BUILD APPLICATION
  # ==========================================================
  #
  # Runs only for:
  #
  # push
  # OR
  # manual execution
  #
  # It does NOT run when automation sends the callback.
  # ==========================================================

  build:

    name: Build Book API

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout application
      # -------------------------------------------------------

      - name: Checkout Book API
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Install Java
      # -------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # -------------------------------------------------------
      # Compile application and run unit tests
      # -------------------------------------------------------

      - name: Build and Unit Test Book API
        run: |

          echo "=========================================="
          echo "BUILDING BOOK API"
          echo "=========================================="

          mvn --batch-mode clean verify


      # -------------------------------------------------------
      # Trigger automation repository
      # -------------------------------------------------------
      #
      # Notice that we pass github.sha.
      #
      # This tells the automation repository exactly which
      # application commit needs to be tested.
      #
      # -------------------------------------------------------

      - name: Trigger API Automation Tests

        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_REPO_TOKEN }}

        run: |

          echo "=========================================="
          echo "APPLICATION BUILD PASSED"
          echo "=========================================="

          echo "Application commit:"
          echo "${{ github.sha }}"

          echo ""
          echo "Triggering automation tests..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/kscorpio77/test-bookapi-automation/dispatches \
            -d '{
                  "event_type":"book-api-build-success",
                  "client_payload":{
                    "application_sha":"${{ github.sha }}"
                  }
                }'

          echo ""
          echo "Automation workflow triggered."


  # ==========================================================
  # JOB 2 - BUILD AND PUSH DOCKER IMAGE
  # ==========================================================
  #
  # THIS IS THE IMPORTANT PART.
  #
  # This job runs ONLY when the automation repository sends:
  #
  #     automation-tests-passed
  #
  # Therefore Docker image creation cannot happen until
  # automation has successfully completed.
  #
  # ==========================================================

  docker-build-and-push:

    name: Build Docker Image and Push to ECR

    if: >
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'automation-tests-passed'

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout EXACT commit that automation tested
      # -------------------------------------------------------

      - name: Checkout Tested Application Commit
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.client_payload.application_sha }}


      # -------------------------------------------------------
      # Configure AWS credentials using OIDC
      # -------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1


      # -------------------------------------------------------
      # Login to Amazon ECR
      # -------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # -------------------------------------------------------
      # Build Docker image
      # -------------------------------------------------------
      #
      # We use the tested Git commit as the image tag.
      #
      # Example:
      #
      # mybookapi:a73f92c
      #
      # -------------------------------------------------------

      - name: Build Docker Image

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          ECR_REPOSITORY: mybookapi

          APPLICATION_SHA: ${{ github.event.client_payload.application_sha }}

        run: |

          IMAGE_TAG=$(echo "$APPLICATION_SHA" | cut -c1-7)

          echo "=========================================="
          echo "BUILDING PRODUCTION DOCKER IMAGE"
          echo "=========================================="

          echo "Commit:"
          echo "$APPLICATION_SHA"

          echo ""
          echo "Image tag:"
          echo "$IMAGE_TAG"

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .


      # -------------------------------------------------------
      # Push Docker image to ECR
      # -------------------------------------------------------

      - name: Push Docker Image to ECR

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          ECR_REPOSITORY: mybookapi

          APPLICATION_SHA: ${{ github.event.client_payload.application_sha }}

        run: |

          IMAGE_TAG=$(echo "$APPLICATION_SHA" | cut -c1-7)

          echo "=========================================="
          echo "PUSHING IMAGE TO AMAZON ECR"
          echo "=========================================="

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "IMAGE SUCCESSFULLY PUSHED"
          echo "=========================================="

          echo ""
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"